# Builds the app on GitHub's servers on every push, so you can download an APK without Android Studio.
# Download: repo -> Actions tab -> the latest run -> Artifacts -> SkillSwap-debug-apk
name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for Java 25 to run Gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest assembleDebug 2>&1 | tee build.log

      # puts the compiler's error lines on the check run, so they show without opening the log
      - name: Show what failed
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not' -A2 build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SkillSwap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
